[project]
name = "flamecheck"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "google-genai>=3.3.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
